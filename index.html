<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MateChat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: #1f2937;
    }

    #loginScreen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #374151;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .login-box h1 {
      margin-top: 0;
      font-size: 34px;
    }

    .login-box p {
      color: #d1d5db;
    }

    input,
    button {
      font-family: inherit;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin: 8px 0;
      font-size: 16px;
      outline: none;
    }

    .main-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 8px;
    }

    .main-button:hover {
      background: #2563eb;
    }

    #error {
      color: #fca5a5;
      margin-top: 10px;
    }

    #chatScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      height: 70px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #374151;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .room {
      color: #9ca3af;
      font-size: 12px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #86efac;
      font-size: 13px;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      transition: box-shadow 0.25s ease;
      padding: 10px 13px;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .message.highlight-message {
      box-shadow: 0 0 0 3px rgba(147,197,253,0.8);
    }

    .message.mine {
      align-self: flex-end;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .message.theirs {
      align-self: flex-start;
      background: #374151;
      border-bottom-left-radius: 4px;
    }

    .sender {
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 3px;
    }

    .message-text {
      font-size: 16px;
      line-height: 1.35;
    }

    .reply-button {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 11px;
      padding: 3px 0;
      margin-top: 5px;
      cursor: pointer;
      opacity: 0.75;
    }

    .reply-button:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .reply-reference {
      padding: 7px 9px;
      margin-bottom: 7px;
      border-left: 3px solid #93c5fd;
      background: rgba(0,0,0,0.18);
      border-radius: 7px;
      cursor: pointer;
      max-width: 100%;
    }

    .reply-reference:hover {
      background: rgba(0,0,0,0.25);
    }

    .reply-reference-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .reply-reference-text {
      font-size: 12px;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reply-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #1f2937;
      border-top: 1px solid #374151;
    }

    .reply-preview.show {
      display: flex;
    }

    .reply-preview-content {
      min-width: 0;
      flex: 1;
      border-left: 3px solid #3b82f6;
      padding-left: 9px;
    }

    .reply-preview-title {
      font-size: 12px;
      font-weight: bold;
      color: #93c5fd;
      margin-bottom: 2px;
    }

    .reply-preview-text {
      font-size: 13px;
      color: #d1d5db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cancel-reply {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #374151;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .cancel-reply:hover {
      background: #4b5563;
    }

    .typing-indicator {
      display: none;
      padding: 0 16px 6px;
      background: #111827;
    }

    .typing-indicator.show {
      display: block;
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 20px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: typingBounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .message-info {
      font-size: 10px;
      opacity: 0.65;
      text-align: right;
      margin-top: 4px;
    }

    /* PHOTO MESSAGES */

    .message-image {
      display: block;
      width: 100%;
      max-width: 320px;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 4px;
    }

    .photo-loading {
      padding: 10px;
      color: #d1d5db;
      font-size: 14px;
    }

    /* COMPOSER */

    .composer {
      position: relative;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111827;
      border-top: 1px solid #374151;
    }

    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      border-radius: 20px;
      background: #374151;
      color: white;
      outline: none;
      font-size: 16px;
    }

    .composer input[type="text"]::placeholder {
      color: #9ca3af;
    }

    .emoji-button,
    .photo-button {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #374151;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .emoji-button:hover,
    .photo-button:hover {
      background: #4b5563;
    }

    .photo-button.uploading {
      opacity: 0.5;
      pointer-events: none;
    }

    .send-button {
      width: 50px;
      height: 48px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #3b82f6;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send-button:hover {
      background: #2563eb;
    }

    /* EMOJI PICKER */

    .emoji-picker {
      display: none;
      position: absolute;
      right: 115px;
      bottom: 70px;
      width: 300px;
      max-height: 280px;
      overflow-y: auto;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 15px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      z-index: 100;
    }

    .emoji-picker.show {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .emoji-item {
      border: none;
      background: transparent;
      color: white;
      font-size: 25px;
      padding: 5px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1;
    }

    .emoji-item:hover {
      background: #374151;
    }

    .emoji-title {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      margin: auto;
    }

    /* UPLOAD STATUS */

    .upload-status {
      display: none;
      position: absolute;
      left: 12px;
      bottom: 70px;
      background: #1f2937;
      border: 1px solid #4b5563;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 150;
    }

    .upload-status.show {
      display: block;
    }

    @media (max-width: 600px) {

      body {
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
      }

      #chatScreen {
        height: 100dvh;
        min-height: 0;
      }

      .header {
        height: 62px;
        flex-shrink: 0;
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px;
      }

      .composer {
        flex-shrink: 0;
        position: sticky;
        bottom: 0;
        padding: 10px;
      }

      .message {
        max-width: 85%;
      }

      .reply-preview {
        padding: 8px 10px;
      }

      .typing-indicator {
        padding-left: 12px;
      }

      .message-image {
        max-width: 250px;
        max-height: 350px;
      }

      .emoji-picker {
        right: 10px;
        bottom: 68px;
        width: calc(100vw - 20px);
        max-height: 260px;
      }

      .emoji-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }
  </style>
</head>

<body>

  <div id="loginScreen">

    <div class="login-box">

      <h1>💬 MateChat</h1>

      <p>Enter your name and your private room code.</p>

      <input
        id="nameInput"
        type="text"
        maxlength="20"
        placeholder="Your name"
      >

      <input
        id="roomInput"
        type="text"
        maxlength="30"
        placeholder="Room code"
      >

      <button class="main-button" onclick="enterChat()">
        Enter Chat
      </button>

      <div id="error"></div>

    </div>

  </div>


  <div id="chatScreen">

    <div class="header">

      <div class="header-left">

        <div class="logo">
          💬 MateChat
        </div>

        <div class="room" id="roomDisplay"></div>

      </div>

      <div class="online">

        <div class="online-dot"></div>

        <span id="onlineText">
          Connecting...
        </span>

      </div>

    </div>


    <div class="messages" id="messages">

      <div class="empty" id="emptyMessage">
        No messages yet.<br>
        Send the first message!
      </div>

    </div>


    <div id="typingIndicator" class="typing-indicator">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="replyPreview" class="reply-preview">
      <div class="reply-preview-content">
        <div id="replyPreviewTitle" class="reply-preview-title">Replying</div>
        <div id="replyPreviewText" class="reply-preview-text"></div>
      </div>
      <button class="cancel-reply" type="button" onclick="cancelReply()" title="Cancel reply">×</button>
    </div>

    <div class="composer">

      <!-- UPLOAD STATUS -->

      <div
        class="upload-status"
        id="uploadStatus"
      >
        Uploading photo...
      </div>


      <!-- EMOJI PICKER -->

      <div
        class="emoji-picker"
        id="emojiPicker"
      >

        <div class="emoji-title">
          Choose an emoji
        </div>

        <div
          class="emoji-grid"
          id="emojiGrid"
        ></div>

      </div>


      <!-- PHOTO FILE INPUT -->

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="handlePhotoSelected(event)"
      >


      <!-- PHOTO BUTTON -->

      <button
        class="photo-button"
        id="photoButton"
        type="button"
        onclick="openPhotoPicker()"
        title="Send a photo"
      >
        📷
      </button>


      <!-- EMOJI BUTTON -->

      <button
        class="emoji-button"
        id="emojiButton"
        type="button"
        onclick="toggleEmojiPicker()"
        title="Emoji"
      >
        😊
      </button>


      <!-- MESSAGE INPUT -->

      <input
        id="messageInput"
        type="text"
        maxlength="1000"
        placeholder="Type a message..."
        autocomplete="off"
      >


      <!-- SEND BUTTON -->

      <button
        class="send-button"
        onclick="sendMessage()"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>


  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyCvx9Oo3xZxkyfGZ-Hm5Xj5os56fVoEX2o",
      authDomain: "peggy-chat-4c0e3.firebaseapp.com",

      storageBucket: "peggy-chat-4c0e3.firebasestorage.app",

      measurementId: "G-94E71PCH6J"
    };


    firebase.initializeApp(firebaseConfig);


    const auth = firebase.auth();

    const db = firebase.firestore();

    const messaging = firebase.messaging();


    const vapidKey =
      "BMomp_XJjMiIV5crL8xF8vBHZ5XFoe37OKEeti8B4GKBeIZMmYne39RqCEyV8RbWrmUKwOJkEDvbsVWNZ8b3kuA";


    const notificationServer =
      "https://peggy-chat.vercel.app/api/notify";


    /*
      CLOUDINARY
    */

    const cloudinaryCloudName =
      "x7safyic";

    const cloudinaryUploadPreset =
      "matechat";


    let currentUser = null;
    let username = "";
    let roomCode = "";
    let unsubscribeMessages = null;
    let unsubscribePresence = null;
    let typingTimeout = null;
    let typingWriteTimeout = null;
    let isCurrentlyTyping = false;
    let replyingTo = null;


    /*
      EMOJI LIST
    */

    const emojis = [

      "😀","😃","😄","😁","😆","😅","😂","🤣",
      "😊","😇","🙂","🙃","😉","😌","😍","🥰",
      "😘","😗","😙","😚","😋","😛","😝","😜",
      "🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
      "😒","😞","😔","😟","😕","🙁","☹️","😣",
      "😖","😫","😩","🥺","😢","😭","😤","😠",
      "😡","🤬","🤯","😳","🥵","🥶","😱","😨",
      "😰","😥","😓","🤗","🤔","🫣","🤭","🤫",
      "🤥","😶","🫠","😐","🫡","😑","😬","🙄",
      "😯","😦","😧","😮","😲","🥱","😴","🤤",
      "😪","😵","🤐","🤢","🤮","🤧","😷","🤒",
      "🤕","🤑","🤠","😈","👿","👹","👺","🤡",
      "💩","👻","💀","☠️","👽","👾","🤖","🎃",

      "❤️","🧡","💛","💚","💙","💜","🖤","🤍",
      "🤎","💔","❣️","💕","💞","💓","💗","💖",
      "💘","💝","💟","💯","💢","💥","💫","💦",
      "💨","💬","💭","💤",

      "👍","👎","👌","✌️","🤞","🤟","🤘","🤙",
      "👏","🙌","🫶","🙏","💪","👋","🤝","☝️",
      "👇","👈","👉","👆","✋","🤚","🖐️","🖖",
      "👀","👄","👅","👂","👃","🧠",

      "🔥","✨","⭐","🌟","💎","🎉","🎊","🎈",
      "🎁","🏆","🥇","🥈","🥉","⚡","💥","🌈",
      "☀️","🌙","🌞","🌸","🌹","🌺","🌻","🌼",

      "🍕","🍔","🍟","🌭","🍿","🍩","🍪","🎂",
      "🍰","🍫","🍭","🍬","🍎","🍓","🍌","🍉",
      "🍇","🍒","🥑","🌮","🍗","🍳","🍦","☕",

      "⚽","🏀","🏈","⚾","🎾","🏐","🎮","🎯",
      "🎵","🎶","🎸","🎤","🎧","📱","💻","🚗",
      "✈️","🚀","🏠","🎥","📸","💡","🔑","💰"

    ];


    /*
      CREATE EMOJI BUTTONS
    */

    const emojiGrid =
      document.getElementById("emojiGrid");


    emojis.forEach((emoji) => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className = "emoji-item";

      button.textContent = emoji;

      button.title = emoji;

      button.addEventListener(
        "click",
        () => insertEmoji(emoji)
      );

      emojiGrid.appendChild(button);

    });


    /*
      OPEN / CLOSE EMOJI PICKER
    */

    function toggleEmojiPicker() {

      const picker =
        document.getElementById("emojiPicker");

      picker.classList.toggle("show");

    }


    /*
      INSERT EMOJI
    */

    function insertEmoji(emoji) {

      const input =
        document.getElementById("messageInput");

      const start =
        input.selectionStart;

      const end =
        input.selectionEnd;

      const before =
        input.value.substring(0, start);

      const after =
        input.value.substring(end);

      input.value =
        before +
        emoji +
        after;

      const newCursorPosition =
        start +
        emoji.length;

      input.focus();

      input.setSelectionRange(
        newCursorPosition,
        newCursorPosition
      );

      document
        .getElementById("emojiPicker")
        .classList.remove("show");

    }


    /*
      CLOSE EMOJI PICKER
    */

    document.addEventListener(
      "click",
      function(event) {

        const picker =
          document.getElementById("emojiPicker");

        const button =
          document.getElementById("emojiButton");

        if (
          picker.classList.contains("show") &&
          !picker.contains(event.target) &&
          event.target !== button
        ) {

          picker.classList.remove("show");

        }

      }
    );


    /*
      FIREBASE LOGIN
    */

    auth.signInAnonymously()
      .then((result) => {

        currentUser = result.user;

        console.log(
          "Signed in:",
          currentUser.uid
        );

      })
      .catch((error) => {

        console.error(error);

        document.getElementById("error").textContent =
          "Firebase sign-in failed: " + error.message;

      });


    /*
      NOTIFICATIONS
    */

    async function setupNotifications() {

      try {

        if (!("Notification" in window)) {

          console.log(
            "This browser does not support notifications."
          );

          return;

        }

        const permission =
          await Notification.requestPermission();

        if (permission !== "granted") {

          console.log(
            "Notification permission was not granted."
          );

          return;

        }

        const registration =
          await navigator.serviceWorker.register(
            "/peggy-chat/firebase-messaging-sw.js"
          );

        const token =
          await messaging.getToken({

            vapidKey: vapidKey,

            serviceWorkerRegistration:
              registration

          });

        if (token) {

          console.log(
            "Notification token created."
          );

          await db.collection("notificationTokens")
            .doc(currentUser.uid)
            .set({

              token: token,

              username: username,

              room: roomCode,

              updatedAt:
                firebase.firestore.FieldValue.serverTimestamp()

            });

          console.log(
            "Notification setup complete."
          );

        }

      } catch (error) {

        console.error(
          "Notification setup failed:",
          error
        );

      }

    }


    /*
      FOREGROUND NOTIFICATIONS
    */

    messaging.onMessage((payload) => {

      console.log(
        "Foreground notification received:",
        payload
      );

      if (
        payload.notification &&
        Notification.permission === "granted"
      ) {

        new Notification(
          payload.notification.title || "MateChat",
          {
            body:
              payload.notification.body ||
              "You have a new message."
          }
        );

      }

    });


    /*
      ENTER CHAT
    */

    function enterChat() {

      const name =
        document.getElementById("nameInput")
          .value
          .trim();

      const room =
        document.getElementById("roomInput")
          .value
          .trim();

      if (!name) {

        document.getElementById("error").textContent =
          "Please enter your name.";

        return;

      }

      if (!room) {

        document.getElementById("error").textContent =
          "Please enter a room code.";

        return;

      }

      if (!currentUser) {

        document.getElementById("error").textContent =
          "Still connecting to Firebase. Try again in a second.";

        return;

      }

      username = name;

      roomCode = room;

      document.getElementById("loginScreen")
        .style.display = "none";

      document.getElementById("chatScreen")
        .style.display = "flex";

      document.getElementById("roomDisplay")
        .textContent = "Room: " + roomCode;

      listenForMessages();
      listenForTyping();

      updatePresence();

      setInterval(
        updatePresence,
        20000
      );

      setupNotifications();

    }


    /*
      SEND TEXT MESSAGE
    */

    async function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (!text) return;

      if (!currentUser) return;

      input.value = "";
      stopTyping();

      const replyTo = replyingTo;
      cancelReply();

      try {

        await db.collection("messages").add({

          room: roomCode,

          text: text,

          sender: currentUser.uid,

          senderName: username,

          type: "text",

          ...(replyTo ? { replyTo: replyTo } : {}),

          timestamp:
            firebase.firestore.FieldValue.serverTimestamp(),

          readBy: {

            [currentUser.uid]: true

          }

        });


        /*
          SEND NOTIFICATION
        */

        sendNotification(text);

      } catch (error) {

        console.error(error);

        alert(
          "Message could not be sent."
        );

      }

    }


    /*
      SEND NOTIFICATION THROUGH VERCEL
    */

    async function sendNotification(notificationText) {

      try {

        const response =
          await fetch(notificationServer, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              room: roomCode,

              senderName: username,

              senderUid: currentUser.uid,

              text: notificationText

            })

          });

        const result =
          await response.json();

        console.log(
          "Notification server:",
          result
        );

      } catch (notificationError) {

        console.error(
          "Notification request failed:",
          notificationError
        );

      }

    }


    /*
      OPEN PHONE / COMPUTER PHOTO PICKER
    */

    function openPhotoPicker() {

      document
        .getElementById("photoInput")
        .click();

    }


    /*
      PHOTO SELECTED
    */

    async function handlePhotoSelected(event) {

      const file =
        event.target.files[0];

      if (!file) return;

      if (!currentUser) {

        alert(
          "Please enter the chat first."
        );

        return;

      }

      if (!file.type.startsWith("image/")) {

        alert(
          "Please choose an image."
        );

        event.target.value = "";

        return;

      }

      try {

        stopTyping();
        const replyTo = replyingTo;
        cancelReply();

        const photoButton =
          document.getElementById("photoButton");

        const uploadStatus =
          document.getElementById("uploadStatus");

        photoButton.classList.add("uploading");

        uploadStatus.textContent =
          "Preparing photo...";

        uploadStatus.classList.add("show");


        /*
          Resize/compress the image first.
        */

        const compressedFile =
          await compressImage(file);


        uploadStatus.textContent =
          "Uploading photo...";


        /*
          Upload directly to Cloudinary.
        */

        const formData =
          new FormData();

        formData.append(
          "file",
          compressedFile
        );

        formData.append(
          "upload_preset",
          cloudinaryUploadPreset
        );


        const uploadResponse =
          await fetch(
            `https://api.cloudinary.com/v1_1/${cloudinaryCloudName}/image/upload`,
            {
              method: "POST",
              body: formData
            }
          );


        if (!uploadResponse.ok) {

          const errorText =
            await uploadResponse.text();

          console.error(
            "Cloudinary error:",
            errorText
          );

          throw new Error(
            "Photo upload failed."
          );

        }


        const uploadResult =
          await uploadResponse.json();


        const imageUrl =
          uploadResult.secure_url;


        /*
          Save photo message to Firestore.
        */

        await db.collection("messages").add({

          room: roomCode,

          text: "",

          imageUrl: imageUrl,

          type: "image",

          sender: currentUser.uid,

          senderName: username,

          ...(replyTo ? { replyTo: replyTo } : {}),

          timestamp:
            firebase.firestore.FieldValue.serverTimestamp(),

          readBy: {

            [currentUser.uid]: true

          }

        });


        /*
          Tell the other device that
          a photo was sent.
        */

        sendNotification(
          "📷 Sent you a photo"
        );


        uploadStatus.textContent =
          "Photo sent!";

        setTimeout(() => {

          uploadStatus.classList.remove("show");

        }, 1200);


      } catch (error) {

        console.error(
          "Photo upload error:",
          error
        );

        alert(
          "Photo could not be sent. Please try again."
        );

        document
          .getElementById("uploadStatus")
          .classList.remove("show");

      }


      document
        .getElementById("photoButton")
        .classList.remove("uploading");


      /*
        Reset file input so the same photo
        can be selected again.
      */

      event.target.value = "";

    }


    /*
      COMPRESS PHOTO
    */

    function compressImage(file) {

      return new Promise((resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload = function(event) {

          const image =
            new Image();

          image.onload = function() {

            const maxWidth = 1600;

            const maxHeight = 1600;

            let width =
              image.width;

            let height =
              image.height;


            /*
              Keep the original proportions.
            */

            if (
              width > maxWidth ||
              height > maxHeight
            ) {

              const widthRatio =
                maxWidth / width;

              const heightRatio =
                maxHeight / height;

              const ratio =
                Math.min(
                  widthRatio,
                  heightRatio
                );

              width =
                Math.round(
                  width * ratio
                );

              height =
                Math.round(
                  height * ratio
                );

            }


            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              width;

            canvas.height =
              height;


            const context =
              canvas.getContext(
                "2d"
              );


            context.drawImage(
              image,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              function(blob) {

                if (!blob) {

                  reject(
                    new Error(
                      "Could not compress image."
                    )
                  );

                  return;

                }


                const compressedFile =
                  new File(
                    [blob],
                    "matechat-photo.jpg",
                    {
                      type: "image/jpeg"
                    }
                  );


                resolve(
                  compressedFile
                );

              },
              "image/jpeg",
              0.82
            );

          };


          image.onerror =
            function() {

              reject(
                new Error(
                  "Could not read image."
                )
              );

            };


          image.src =
            event.target.result;

        };


        reader.onerror =
          function() {

            reject(
              new Error(
                "Could not read file."
              )
            );

          };


        reader.readAsDataURL(file);

      });

    }


    /*
      REPLY TO A MESSAGE
    */

    function startReply(messageId, message) {

      replyingTo = {
        id: messageId,
        sender: message.sender || "",
        senderName: message.senderName || "Unknown",
        text: message.text || "",
        imageUrl: message.imageUrl || "",
        type: message.type || "text"
      };

      const preview = document.getElementById("replyPreview");
      const title = document.getElementById("replyPreviewTitle");
      const previewText = document.getElementById("replyPreviewText");

      title.textContent = "Replying to " + replyingTo.senderName;
      previewText.textContent =
        replyingTo.type === "image"
          ? "📷 Photo"
          : replyingTo.text || "Message";

      preview.classList.add("show");

      document.getElementById("messageInput").focus();

      document.getElementById("messages").scrollTop =
        document.getElementById("messages").scrollHeight;
    }


    function cancelReply() {

      replyingTo = null;

      document
        .getElementById("replyPreview")
        .classList.remove("show");

    }


    function jumpToMessage(messageId) {

      const target = document.getElementById("message-" + messageId);

      if (!target) return;

      target.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      target.classList.add("highlight-message");

      setTimeout(() => {
        target.classList.remove("highlight-message");
      }, 1200);
    }


    /*
      TYPING STATUS
    */

    function updateTypingStatus() {

      const input = document.getElementById("messageInput");

      if (!input.value.trim()) {
        stopTyping();
        return;
      }

      if (!isCurrentlyTyping) {
        isCurrentlyTyping = true;
        setTypingStatus(true);
      }

      clearTimeout(typingTimeout);

      typingTimeout = setTimeout(() => {
        stopTyping();
      }, 2000);
    }


    async function setTypingStatus(typing) {

      if (!currentUser || !roomCode) return;

      clearTimeout(typingWriteTimeout);

      typingWriteTimeout = setTimeout(async () => {
        try {
          await db.collection("presence")
            .doc(currentUser.uid)
            .set({
              username: username,
              room: roomCode,
              typing: typing,
              typingAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        } catch (error) {
          console.log("Typing status error:", error);
        }
      }, 50);
    }


    function stopTyping() {

      clearTimeout(typingTimeout);
      isCurrentlyTyping = false;
      setTypingStatus(false);
    }


    function listenForTyping() {

      if (unsubscribePresence) {
        unsubscribePresence();
      }

      unsubscribePresence = db.collection("presence")
        .where("room", "==", roomCode)
        .onSnapshot((snapshot) => {

          let someoneTyping = false;

          const now = Date.now();

          snapshot.forEach((doc) => {

            if (doc.id === currentUser.uid) return;

            const data = doc.data();

            if (data.typing === true) {

              let typingTime = 0;

              if (data.typingAt && data.typingAt.toMillis) {
                typingTime = data.typingAt.toMillis();
              }

              if (typingTime && now - typingTime < 4000) {
                someoneTyping = true;
              }
            }
          });

          document
            .getElementById("typingIndicator")
            .classList.toggle("show", someoneTyping);

        }, (error) => {
          console.log("Typing listener error:", error);
        });
    }


    /*
      ENTER KEY SENDS MESSAGE
    */

    document
      .getElementById("messageInput")
      .addEventListener(
        "input",
        function() {
          updateTypingStatus();
        }
      );


    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    /*
      LOAD MESSAGES
    */

    function listenForMessages() {

      if (unsubscribeMessages) {

        unsubscribeMessages();

      }

      unsubscribeMessages =
        db.collection("messages")
          .where(
            "room",
            "==",
            roomCode
          )
          .orderBy(
            "timestamp",
            "asc"
          )
          .onSnapshot(

            (snapshot) => {

              const container =
                document.getElementById(
                  "messages"
                );

              container.innerHTML = "";


              if (snapshot.empty) {

                container.innerHTML = `
                  <div class="empty">
                    No messages yet.<br>
                    Send the first message!
                  </div>
                `;

                return;

              }


              snapshot.forEach(
                async (doc) => {

                  const message =
                    doc.data();


                  const isMine =
                    message.sender ===
                    currentUser.uid;


                  const div =
                    document.createElement(
                      "div"
                    );


                  div.id = "message-" + doc.id;

                  div.className =
                    "message " +
                    (
                      isMine
                        ? "mine"
                        : "theirs"
                    );


                  const time =
                    message.timestamp
                      ? message.timestamp.toDate()
                      : new Date();


                  const timeText =
                    time.toLocaleTimeString(
                      [],
                      {
                        hour: "2-digit",
                        minute: "2-digit"
                      }
                    );


                  let readText = "";


                  if (isMine) {

                    const readBy =
                      message.readBy || {};


                    const someoneRead =
                      Object.keys(readBy)
                        .some(
                          uid =>
                            uid !==
                            currentUser.uid &&
                            readBy[uid]
                        );


                    readText =
                      someoneRead
                        ? "✓✓ Read"
                        : "✓ Sent";

                  }


                  const reply = message.replyTo || null;

                  let replyHTML = "";

                  if (reply) {

                    const replyPreviewText =
                      reply.type === "image"
                        ? "📷 Photo"
                        : (reply.text || "Message");

                    replyHTML = `
                      <div class="reply-reference" data-jump-id="${escapeHTML(reply.id || "")}">
                        <div class="reply-reference-name">
                          ${escapeHTML(reply.senderName || "Unknown")}
                        </div>
                        <div class="reply-reference-text">
                          ${escapeHTML(replyPreviewText)}
                        </div>
                      </div>
                    `;
                  }

                  const replyButtonHTML = `
                    <button class="reply-button" type="button">↩ Reply</button>
                  `;

                  /*
                    IMAGE MESSAGE
                  */

                  if (
                    message.type === "image" &&
                    message.imageUrl
                  ) {

                    div.innerHTML = `

                      <div class="sender">
                        ${escapeHTML(
                          message.senderName ||
                          "Unknown"
                        )}
                      </div>

                      ${replyHTML}

                      <img
                        class="message-image"
                        src="${escapeHTML(
                          message.imageUrl
                        )}"
                        alt="Photo"
                        loading="lazy"
                      >

                      ${replyButtonHTML}

                      <div class="message-info">

                        ${timeText}

                        ${
                          isMine
                            ? " • " + readText
                            : ""
                        }

                      </div>

                    `;

                  } else {

                    /*
                      NORMAL TEXT MESSAGE
                    */

                    div.innerHTML = `

                      <div class="sender">
                        ${escapeHTML(
                          message.senderName ||
                          "Unknown"
                        )}
                      </div>

                      ${replyHTML}

                      <div class="message-text">
                        ${escapeHTML(
                          message.text || ""
                        )}
                      </div>

                      ${replyButtonHTML}

                      <div class="message-info">

                        ${timeText}

                        ${
                          isMine
                            ? " • " + readText
                            : ""
                        }

                      </div>

                    `;

                  }

                  const replyButton =
                    div.querySelector(".reply-button");

                  replyButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    startReply(doc.id, message);
                  });

                  const replyReference =
                    div.querySelector(".reply-reference");

                  if (replyReference) {
                    replyReference.addEventListener("click", (event) => {
                      event.stopPropagation();
                      jumpToMessage(replyReference.dataset.jumpId);
                    });
                  }

                  const messageImage =
                    div.querySelector(".message-image");

                  if (messageImage) {
                    messageImage.addEventListener("click", () => {
                      window.open(messageImage.src, "_blank");
                    });
                  }

                  container.appendChild(
                    div
                  );


                  /*
                    MARK MESSAGE AS READ
                  */

                  if (!isMine) {

                    const readBy =
                      message.readBy || {};


                    if (
                      !readBy[
                        currentUser.uid
                      ]
                    ) {

                      try {

                        await db
                          .collection("messages")
                          .doc(doc.id)
                          .update({

                            [
                              `readBy.${currentUser.uid}`
                            ]: true

                          });

                      } catch (error) {

                        console.log(
                          "Read receipt error:",
                          error
                        );

                      }

                    }

                  }

                }
              );


              container.scrollTop =
                container.scrollHeight;

            },


            (error) => {

              console.error(error);

              document.getElementById(
                "messages"
              ).innerHTML =

                `<div class="empty">
                  Could not load messages.<br><br>
                  ${escapeHTML(
                    error.message
                  )}
                </div>`;

            }

          );

    }


    /*
      ONLINE PRESENCE
    */

    async function updatePresence() {

      if (
        !currentUser ||
        !roomCode
      ) return;


      try {

        await db.collection("presence")
          .doc(currentUser.uid)
          .set({

            username: username,

            room: roomCode,

            lastSeen:
              firebase.firestore.FieldValue.serverTimestamp()

          }, { merge: true });


        document.getElementById(
          "onlineText"
        ).textContent = "Online";


      } catch (error) {

        console.log(
          "Presence error:",
          error
        );

      }

    }


    /*
      STOP TYPING WHEN LEAVING THE PAGE
    */

    window.addEventListener("beforeunload", () => {
      if (currentUser && roomCode) {
        db.collection("presence")
          .doc(currentUser.uid)
          .set({
            typing: false,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true })
          .catch(() => {});
      }
    });


    /*
      HTML ESCAPING
    */

    function escapeHTML(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
